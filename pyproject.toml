[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx2"
version = "0.1.0"
description = "Capability-driven MLX inference runtime for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "provenance/*.NOTICE", "provenance/LICENSE*"]
authors = [{ name = "Pierre Lamy" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]
mlx = ["mlx>=0.32"]
hysparse2-research = ["mlx>=0.32", "numpy>=2", "tokenizers>=0.22"]
hysparse2-data = ["numpy>=2", "tokenizers>=0.22", "pyarrow>=25"]
serve = ["mlx>=0.32.2.dev20260829", "transformers>=5.12,<6", "numpy>=2", "psutil>=7", "jinja2>=3.1", "regex>=2024.11"]
observability = [
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "prometheus-client>=0.21",
]
# mlx-vlm is pinned to one revision: main after the 0.7.3 release, which adds
# #2342 (3/5/6-bit KV width), #2357 (Qwen3.5 batched left padding), #2358
# (small top-p / low temperature) and #2362.  Gemma 4, Gemma 3n and MiniCPM-o
# execute this code and refuse any other revision (adapters/mlx_vlm_pin.py).
# The 0.7.1 per-cycle slowdown (omlx#3750) concerned Qwen MTP routes, which do
# not import mlx-vlm.  Qwen-Image keeps its own pin in generative_media.py.
multimodal = [
    "pillow>=10",
    "opencv-python>=4.10",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@67599f2e8ec31bf35cbb7b02794114f20844f0bb",
]
image-convert = ["gguf>=0.19,<0.20", "numpy>=2", "safetensors>=0.8", "torch>=2.4"]

[project.scripts]
mlx2-serve = "mlx2.server:main"
mlx2 = "mlx2.cli:main"
mlx2-diarize = "mlx2.diarize_cli:main"
mlx2-top = "mlx2.top:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.package-data]
"mlx2.adapters" = ["assets/*.npz", "assets/*.json"]
